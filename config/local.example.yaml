gateway:
  mode: local
  bind: 127.0.0.1

broker:
  backend: client_portal_gateway
  base_url: https://localhost:5000
  allow_insecure_tls_for_localhost: true

auth:
  source: local_config
  enabled_scopes:
    - ibkr:health:read
    - ibkr:accounts:read
    - ibkr:portfolio:read
    - ibkr:positions:read
    - ibkr:marketdata:read
    - ibkr:orders:read
    - ibkr:audit:read
    # Add only when the matching feature is explicitly enabled:
    # - ibkr:orders:preview
    # - ibkr:risk:read
    # - ibkr:orders:paper:submit
    # - ibkr:orders:paper:cancel
    # - ibkr:orders:live:submit
    # - ibkr:orders:live:cancel

audit:
  storage: sqlite
  sqlite_path: ./data/audit.sqlite3
  hmac_secret_env: IBKR_AUDIT_HMAC_SECRET

safety:
  read_only: true
  remote_mcp_enabled: false
  sidecar_enabled: false
  order_preview_enabled: false
  paper_trading_enabled: false
  live_trading_enabled: false

remote_mcp:
  enabled: false
  bind_address: 127.0.0.1:8080
  # Required only when remote_mcp.enabled and safety.remote_mcp_enabled are true:
  # resource: https://gateway.example.com/mcp
  # issuer: https://auth.example.com/
  # jwks_url: https://auth.example.com/.well-known/jwks.json
  # metadata_url: https://auth.example.com/.well-known/openid-configuration
  # audiences:
  #   - https://gateway.example.com/mcp
  # allowed_scopes:
  #   - ibkr:health:read
  #   - ibkr:accounts:read
  #   - ibkr:portfolio:read
  #   - ibkr:positions:read
  #   - ibkr:marketdata:read
  #   - ibkr:orders:read
  #   - ibkr:audit:read
  clock_skew_seconds: 60
  # token_id_hmac_secret_env: IBKR_REMOTE_TOKEN_HMAC_SECRET

live_trading:
  enabled: false
  allowed_accounts: []
  risk_policy_id:
  paper_to_live_checklist_acknowledged: false
  reconciler_interval_seconds: 5
