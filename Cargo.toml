[package]
name = "ibkr-agent-gateway"
version = "0.1.0"
edition = "2024"
rust-version = "1.94.1"
description = "Unofficial local-first CLI and MCP gateway for Interactive Brokers workflows."
license = "MIT"
repository = "https://github.com/mth-bou/ibkr-agent-gateway"
readme = "README.md"
keywords = ["ibkr", "mcp", "trading", "gateway", "cli"]
categories = ["api-bindings", "command-line-utilities"]
include = [
  "/Cargo.lock",
  "/Cargo.toml",
  "/README.md",
  "/config/local.example.yaml",
  "/docs/**",
  "/examples/**",
  "/rust-toolchain.toml",
  "/src/**",
  "/tests/**",
]

[[bin]]
name = "ibkr-agent"
path = "src/bin/ibkr-agent.rs"

[dependencies]
async-trait.workspace = true
base64.workspace = true
clap.workspace = true
hmac.workspace = true
reqwest.workspace = true
ring.workspace = true
rust_decimal.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx-core.workspace = true
sqlx-sqlite.workspace = true
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
url.workspace = true
uuid.workspace = true

[workspace]
members = ["."]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.94.1"
license = "MIT"
repository = "https://github.com/mth-bou/ibkr-agent-gateway"

[workspace.dependencies]
async-trait = "0.1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
config = "0.15"
hmac = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
ring = "0.17"
rust_decimal = { version = "1", features = ["serde"] }
schemars = { version = "0.8", features = ["uuid1"] }
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx-core = { version = "=0.8.6", default-features = false, features = ["_rt-tokio", "time", "uuid"] }
sqlx-sqlite = { version = "=0.8.6", default-features = false, features = ["bundled", "time", "uuid"] }
thiserror = "2"
time = { version = "0.3", features = ["formatting", "macros", "parsing", "serde", "serde-well-known"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
tracing = "0.1"
url = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["serde", "v4", "v7"] }
wiremock = "0.6"
zeroize = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
dbg_macro = "deny"

[dev-dependencies]
tokio.workspace = true
